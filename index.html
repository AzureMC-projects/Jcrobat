<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jcrobat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="logo">Jcrobat</div>
    <div class="toolbar-actions">
      <button id="btn-open">📂 Open</button>
      <button id="btn-merge">🔀 Merge</button>
      <button id="btn-split">✂️ Split</button>
      <button id="btn-delete-page">🗑️ Delete Page</button>
      <button id="btn-rotate">🔄 Rotate</button>
      <button id="btn-addtext">✏️ Text</button>
      <button id="btn-highlight">🖍️ Highlight</button>
      <button id="btn-draw">🖊️ Draw</button>
      <button id="btn-save">💾 Download</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>Pages</h3>
      <div id="page-nav"></div>
      <div class="page-controls">
        <button id="btn-page-up" title="Move page up">↑</button>
        <button id="btn-page-down" title="Move page down">↓</button>
      </div>
    </div>
    <div class="sidebar-section">
      <h3>Tools</h3>
      <div id="text-input-area" class="hidden">
        <textarea id="text-input" placeholder="Type text..." rows="3"></textarea>
        <div class="row">
          <input type="number" id="text-x" placeholder="X" value="50">
          <input type="number" id="text-y" placeholder="Y" value="700">
          <input type="number" id="text-size" placeholder="Size" value="24">
        </div>
        <button id="btn-apply-text">Apply</button>
      </div>
      <div id="split-input-area" class="hidden">
        <p>Extract pages (e.g. 1-3, 5, 7-9):</p>
        <input type="text" id="split-range" placeholder="1-3">
        <button id="btn-apply-split">Extract</button>
      </div>
    </div>
  </aside>

  <main class="viewer" id="viewer">
    <div id="canvas-container"></div>
    <canvas id="overlay-canvas" class="hidden"></canvas>
  </main>

  <footer class="status-bar">
    <span id="page-indicator">Page 1 of 1</span>
    <span id="zoom-indicator">100%</span>
    <span id="tool-indicator"></span>
    <div class="zoom-controls">
      <button id="zoom-out">−</button>
      <button id="zoom-in">+</button>
    </div>
  </footer>

  <input type="file" id="file-input" accept="application/pdf" hidden>
  <input type="file" id="merge-input" accept="application/pdf" multiple hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
