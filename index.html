<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jcrobat – PDF Viewer & Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header { background: #16213e; padding: 10px 20px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #0f3460; }
    header h1 { font-size: 1.3rem; color: #e94560; }
    header h1 span { color: #fff; }

    /* Toolbar */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .toolbar button { background: #0f3460; color: #e0e0e0; border: 1px solid #1a5276; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; }
    .toolbar button:hover { background: #1a5276; }
    .toolbar button.active { background: #e94560; border-color: #e94560; }

    /* Main layout */
    main { flex: 1; display: flex; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 200px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; }
    .sidebar h3 { padding: 12px; font-size: 0.8rem; text-transform: uppercase; color: #888; }
    .page-list { flex: 1; overflow-y: auto; padding: 8px; }
    .page-thumb { width: 100%; margin-bottom: 8px; border: 2px solid transparent; border-radius: 4px; cursor: pointer; background: #fff; }
    .page-thumb.active { border-color: #e94560; }

    /* Viewer */
    .viewer { flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #0a0a1a; }
    #canvas-container { position: relative; }
    canvas { display: block; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }

    /* Drop zone */
    .drop-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #0f3460; border-radius: 12px; margin: 40px; min-height: 300px; cursor: pointer; transition: border-color 0.3s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #e94560; }
    .drop-zone h2 { margin-bottom: 12px; color: #888; }
    .drop-zone p { color: #666; }

    /* Annotation overlay */
    .anno-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .anno-text { position: absolute; pointer-events: auto; background: rgba(233,69,96,0.9); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 12px; cursor: move; user-select: none; }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-content { background: #16213e; padding: 24px; border-radius: 8px; min-width: 320px; max-width: 450px; }
    .modal-content h3 { margin-bottom: 16px; }
    .modal-content label { display: block; margin-bottom: 12px; font-size: 0.9rem; }
    .modal-content input, .modal-content select { width: 100%; padding: 8px; margin-top: 4px; background: #0f3460; border: 1px solid #1a5276; color: #e0e0e0; border-radius: 4px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .modal-actions button { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: #0f3460; color: #e0e0e0; }

    /* Status bar */
    .status-bar { background: #16213e; padding: 6px 20px; font-size: 0.8rem; color: #888; display: flex; justify-content: space-between; border-top: 1px solid #0f3460; }

    /* File list for merge */
    .file-list { margin: 8px 0; }
    .file-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.85rem; }
    .file-item button { background: none; border: none; color: #e94560; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>J<span>crobat</span></h1>
  <div class="toolbar">
    <button onclick="openFile()">📂 Open</button>
    <button onclick="addAnnotation()">✏️ Annotate</button>
    <button onclick="showMergeModal()">🔗 Merge</button>
    <button onclick="showSplitModal()">✂️ Split</button>
    <button onclick="showRotateModal()">🔄 Rotate</button>
    <button onclick="showTextModal()">📝 Add Text</button>
    <button onclick="downloadPDF()">💾 Save</button>
    <button onclick="printPDF()">🖨️ Print</button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <h3>Pages</h3>
    <div class="page-list" id="pageList"></div>
  </aside>
  <div class="viewer" id="viewer">
    <div class="drop-zone" id="dropZone" onclick="openFile()">
      <h2>📄 Drop a PDF here</h2>
      <p>or click to browse</p>
    </div>
  </div>
</main>

<div class="status-bar">
  <span id="statusLeft">Ready</span>
  <span id="statusRight"></span>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept="application/pdf" style="display:none" multiple />

<!-- Merge Modal -->
<div class="modal" id="mergeModal">
  <div class="modal-content">
    <h3>Merge PDFs</h3>
    <p style="font-size:0.85rem;color:#888;margin-bottom:8px;">Add PDFs to merge (in order):</p>
    <div class="file-list" id="mergeFileList"></div>
    <input type="file" id="mergeFileInput" accept="application/pdf" multiple style="display:none" />
    <button onclick="document.getElementById('mergeFileInput').click()" style="margin-top:8px;background:#0f3460;color:#e0e0e0;border:1px solid #1a5276;padding:6px 12px;border-radius:4px;cursor:pointer;">+ Add Files</button>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('mergeModal')">Cancel</button>
      <button class="btn-primary" onclick="mergePDFs()">Merge</button>
    </div>
  </div>
</div>

<!-- Split Modal -->
<div class="modal" id="splitModal">
  <div class="modal-content">
    <h3>Split PDF</h3>
    <label>From page:
      <input type="number" id="splitFrom" min="1" value="1" />
    </label>
    <label>To page:
      <input type="number" id="splitTo" min="1" value="1" />
    </label>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('splitModal')">Cancel</button>
      <button class="btn-primary" onclick="splitPDF()">Split & Download</button>
    </div>
  </div>
</div>

<!-- Rotate Modal -->
<div class="modal" id="rotateModal">
  <div class="modal-content">
    <h3>Rotate Page</h3>
    <label>Page number:
      <input type="number" id="rotatePage" min="1" value="1" />
    </label>
    <label>Angle:
      <select id="rotateAngle">
        <option value="90">90° clockwise</option>
        <option value="180">180°</option>
        <option value="270">90° counter-clockwise</option>
      </select>
    </label>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('rotateModal')">Cancel</button>
      <button class="btn-primary" onclick="rotatePage()">Rotate</button>
    </div>
  </div>
</div>

<!-- Text Modal -->
<div class="modal" id="textModal">
  <div class="modal-content">
    <h3>Add Text to Page</h3>
    <label>Text:
      <input type="text" id="textInput" placeholder="Enter text..." />
    </label>
    <label>Page:
      <input type="number" id="textPage" min="1" value="1" />
    </label>
    <label>X position:
      <input type="number" id="textX" value="50" />
    </label>
    <label>Y position (from top):
      <input type="number" id="textY" value="50" />
    </label>
