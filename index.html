<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jcrobat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <span class="logo">Jcrobat</span>
      <span class="doc-name" id="doc-name">Sample Document.pdf</span>
    </div>
    <div class="topbar-right">
      <span id="page-indicator">Page 1 of 1</span>
      <span class="sep">|</span>
      <span id="zoom-indicator">100%</span>
      <button id="zoom-out" class="icon-btn">−</button>
      <button id="zoom-in" class="icon-btn">+</button>
      <button id="btn-fit" class="icon-btn" title="Fit to page">⊡</button>
    </div>
  </div>

  <nav class="ribbon">
    <div class="ribbon-tabs">
      <button class="tab active" data-panel="tools">Tools</button>
      <button class="tab" data-panel="organize">Organize</button>
      <button class="tab" data-panel="export">Export</button>
    </div>

    <div class="ribbon-panel" id="panel-tools">
      <div class="ribbon-group">
        <div class="ribbon-group-label">Annotate</div>
        <div class="ribbon-group-items">
          <button id="btn-addtext" class="ribbon-btn"><span class="ribbon-icon">T</span>Text</button>
          <button id="btn-highlight" class="ribbon-btn"><span class="ribbon-icon">H</span>Highlight</button>
          <button id="btn-draw" class="ribbon-btn"><span class="ribbon-icon">✎</span>Draw</button>
          <button id="btn-stamp" class="ribbon-btn"><span class="ribbon-icon">S</span>Stamp</button>
        </div>
      </div>
      <div class="ribbon-group">
        <div class="ribbon-group-label">Edit</div>
        <div class="ribbon-group-items">
          <button id="btn-rotate" class="ribbon-btn"><span class="ribbon-icon">↻</span>Rotate</button>
          <button id="btn-delete-page" class="ribbon-btn"><span class="ribbon-icon">✕</span>Delete</button>
        </div>
      </div>
      <div class="ribbon-group">
        <div class="ribbon-group-label">File</div>
        <div class="ribbon-group-items">
          <button id="btn-open" class="ribbon-btn"><span class="ribbon-icon">📂</span>Open</button>
          <button id="btn-save" class="ribbon-btn primary"><span class="ribbon-icon">⬇</span>Download</button>
        </div>
      </div>
    </div>

    <div class="ribbon-panel hidden" id="panel-organize">
      <div class="ribbon-group">
        <div class="ribbon-group-label">Pages</div>
        <div class="ribbon-group-items">
          <button id="btn-merge" class="ribbon-btn"><span class="ribbon-icon">⊞</span>Merge</button>
          <button id="btn-split" class="ribbon-btn"><span class="ribbon-icon">✂</span>Split</button>
          <button id="btn-page-up" class="ribbon-btn"><span class="ribbon-icon">↑</span>Up</button>
          <button id="btn-page-down" class="ribbon-btn"><span class="ribbon-icon">↓</span>Down</button>
        </div>
      </div>
    </div>

    <div class="ribbon-panel hidden" id="panel-export">
      <div class="ribbon-group">
        <div class="ribbon-group-label">Export</div>
        <div class="ribbon-group-items">
          <button id="btn-save" class="ribbon-btn primary"><span class="ribbon-icon">⬇</span>PDF</button>
          <button id="btn-save-png" class="ribbon-btn"><span class="ribbon-icon">🖼</span>PNG</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-area">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Pages</span>
        <button id="btn-toggle-sidebar" class="icon-btn">◀</button>
      </div>
      <div id="page-nav" class="page-nav"></div>
    </aside>

    <main class="viewer" id="viewer">
      <div class="page-wrapper" id="page-wrapper">
        <canvas id="pdf-canvas"></canvas>
        <canvas id="overlay-canvas" class="hidden"></canvas>
      </div>
    </main>
  </div>

  <div class="tool-options hidden" id="tool-options">
    <div id="text-options" class="tool-option-set hidden">
      <input type="text" id="text-input" placeholder="Enter text...">
      <input type="number" id="text-x" placeholder="X" value="50">
      <input type="number" id="text-y" placeholder="Y" value="700">
      <input type="number" id="text-size" placeholder="Size" value="24">
      <select id="text-color">
        <option value="0,0,0">Black</option>
        <option value="1,0,0">Red</option>
        <option value="0,0,1">Blue</option>
      </select>
      <button id="btn-apply-text" class="primary">Apply</button>
    </div>
    <div id="split-options" class="tool-option-set hidden">
      <span>Pages:</span>
      <input type="text" id="split-range" placeholder="1-3, 5">
      <button id="btn-apply-split" class="primary">Extract</button>
    </div>
    <div id="stamp-options" class="tool-option-set hidden">
      <span>Stamp:</span>
      <input type="text" id="stamp-text" value="CONFIDENTIAL">
      <button id="btn-apply-stamp" class="primary">Stamp</button>
    </div>
  </div>

  <footer class="status-bar">
    <span id="tool-indicator"></span>
    <span class="sep">|</span>
    <span id="file-size"></span>
    <span class="sep">|</span>
    <span id="doc-info"></span>
  </footer>

  <input type="file" id="file-input" accept="application/pdf" hidden>
  <input type="file" id="merge-input" accept="application/pdf" multiple hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
